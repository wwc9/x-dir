<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>「自定义」入口图标 · 六个候选</title>
<style>
  :root {
    --canvas: #eef0f3;
    --surface: #ffffff;
    --surface2: #f3f5f8;
    --hairline: #e2e5ea;
    --text: #1f2530;
    --muted: #7a828e;
    --accent: #3574f0;
    --accent-weak: rgba(53, 116, 240, 0.10);
    --accent-line: rgba(53, 116, 240, 0.45);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 28px clamp(16px, 4vw, 56px) 64px;
    background: var(--canvas); color: var(--text);
    font: 13px/1.65 "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
  }
  header h1 { font-size: 18px; margin: 0 0 6px; }
  header p { margin: 0 0 8px; color: var(--muted); }
  main { max-width: 1020px; }

  /* ══ 模拟顶栏：点下方候选卡实时替换本条的图标 ══ */
  .titlebar {
    display: flex; align-items: center; gap: 4px; padding: 0 10px; height: 44px;
    background: var(--surface); border-radius: 12px; margin-bottom: 22px;
    box-shadow: 0 1px 2px rgba(31, 37, 48, 0.05), 0 8px 24px rgba(31, 37, 48, 0.06);
  }
  .tbtn {
    display: inline-flex; align-items: center; justify-content: center;
    width: 30px; height: 26px; border-radius: 8px; color: var(--text);
  }
  .tbtn.on { background: var(--accent-weak); box-shadow: 0 0 0 1px var(--accent-line) inset; }
  .tbtn svg { width: 16px; height: 16px; }
  .tb-sep { width: 1px; height: 18px; background: var(--hairline); margin: 0 4px; }
  .tb-drag { flex: 1; text-align: center; color: var(--muted); font-size: 12.5px; }
  .tb-note { color: var(--muted); font-size: 12px; margin: -12px 0 26px 4px; }

  /* ══ 候选卡 ══ */
  .grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 14px;
  }
  .cand {
    display: flex; gap: 14px; align-items: flex-start; cursor: pointer;
    background: var(--surface); border: 1px solid var(--hairline); border-radius: 12px;
    padding: 14px; transition: border-color 0.12s, box-shadow 0.12s;
  }
  .cand:hover { border-color: var(--accent-line); }
  .cand.on { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(53, 116, 240, 0.16); }
  .cand .big {
    flex: 0 0 auto; width: 52px; height: 52px; border-radius: 12px;
    background: var(--accent-weak); color: var(--accent);
    display: flex; align-items: center; justify-content: center;
  }
  .cand .big svg { width: 28px; height: 28px; }
  .cand h3 { margin: 0 0 2px; font-size: 13.5px; }
  .cand h3 code {
    margin-left: 6px; padding: 1px 6px; border-radius: 6px; background: var(--surface2);
    color: var(--muted); font-size: 11px; font-weight: 400;
  }
  .cand .why { margin: 0; color: var(--muted); font-size: 12.5px; }
  .cand .verdict { margin: 4px 0 0; font-size: 12px; }
  .verdict.pro { color: #2b62c9; }
  .verdict.con { color: #a06a00; }
</style>
</head>
<body>
<header>
  <h1>「自定义」入口图标 · 六个候选</h1>
  <p>均为 lucide（strokeWidth 2，与应用同源渲染）。点击候选卡 → 上方模拟顶栏的「自定义」按钮实时换图。</p>
</header>

<div class="titlebar">
  <span class="tbtn">▤</span>
  <span class="tbtn">⟳</span>
  <span class="tbtn">★</span>
  <span class="tbtn">🔍</span>
  <span class="tb-sep"></span>
  <span class="tbtn on" id="live-btn"></span>
  <span class="tb-sep"></span>
  <span class="tbtn">⚙</span>
  <span class="tb-drag">此电脑</span>
  <span class="tbtn">—</span><span class="tbtn">□</span><span class="tbtn">✕</span>
</div>
<p class="tb-note">↑ 模拟顶栏：图标实际渲染尺寸 16px（与应用一致）；下方卡片为 28px 放大展示。</p>

<main>
  <div class="grid" id="grid"></div>
</main>

<script>
/* 由项目内 lucide-react 渲染的真实 SVG（strokeWidth 2） */
const ICONS = {
  SlidersHorizontal: '<svg class="ico" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-sliders-horizontal" aria-hidden="true"><path d="M10 5H3"></path><path d="M12 19H3"></path><path d="M14 3v4"></path><path d="M16 17v4"></path><path d="M21 12h-9"></path><path d="M21 19h-5"></path><path d="M21 5h-7"></path><path d="M8 10v4"></path><path d="M8 12H3"></path></svg>',
  Blocks: '<svg class="ico" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-blocks" aria-hidden="true"><path d="M10 22V7a1 1 0 0 0-1-1H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-5a1 1 0 0 0-1-1H2"></path><rect x="14" y="2" width="8" height="8" rx="1"></rect></svg>',
  LayoutTemplate: '<svg class="ico" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-layout-template" aria-hidden="true"><rect width="18" height="7" x="3" y="3" rx="1"></rect><rect width="9" height="7" x="3" y="14" rx="1"></rect><rect width="5" height="7" x="16" y="14" rx="1"></rect></svg>',
  Component: '<svg class="ico" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-component" aria-hidden="true"><path d="M15.536 11.293a1 1 0 0 0 0 1.414l2.376 2.377a1 1 0 0 0 1.414 0l2.377-2.377a1 1 0 0 0 0-1.414l-2.377-2.377a1 1 0 0 0-1.414 0z"></path><path d="M2.297 11.293a1 1 0 0 0 0 1.414l2.377 2.377a1 1 0 0 0 1.414 0l2.377-2.377a1 1 0 0 0 0-1.414L6.088 8.916a1 1 0 0 0-1.414 0z"></path><path d="M8.916 17.912a1 1 0 0 0 0 1.415l2.377 2.376a1 1 0 0 0 1.414 0l2.377-2.376a1 1 0 0 0 0-1.415l-2.377-2.376a1 1 0 0 0-1.414 0z"></path><path d="M8.916 4.674a1 1 0 0 0 0 1.414l2.377 2.376a1 1 0 0 0 1.414 0l2.377-2.376a1 1 0 0 0 0-1.414l-2.377-2.377a1 1 0 0 0-1.414 0z"></path></svg>',
  WandSparkles: '<svg class="ico" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-wand-sparkles" aria-hidden="true"><path d="m21.64 3.64-1.28-1.28a1.21 1.21 0 0 0-1.72 0L2.36 18.64a1.21 1.21 0 0 0 0 1.72l1.28 1.28a1.2 1.2 0 0 0 1.72 0L21.64 5.36a1.2 1.2 0 0 0 0-1.72"></path><path d="m14 7 3 3"></path><path d="M5 6v4"></path><path d="M19 14v4"></path><path d="M10 2v2"></path><path d="M7 8H3"></path><path d="M21 16h-4"></path><path d="M11 3H9"></path></svg>',
  Paintbrush: '<svg class="ico" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-paintbrush" aria-hidden="true"><path d="m14.622 17.897-10.68-2.913"></path><path d="M18.376 2.622a1 1 0 1 1 3.002 3.002L17.36 9.643a.5.5 0 0 0 0 .707l.944.944a2.41 2.41 0 0 1 0 3.408l-.944.944a.5.5 0 0 1-.707 0L8.354 7.348a.5.5 0 0 1 0-.707l.944-.944a2.41 2.41 0 0 1 3.408 0l.944.944a.5.5 0 0 0 .707 0z"></path><path d="M9 8c-1.804 2.71-3.97 3.46-6.583 3.948a.507.507 0 0 0-.302.819l7.32 8.883a1 1 0 0 0 1.185.204C12.735 20.405 16 16.792 16 15"></path></svg>',
};

const CANDS = [
  { key: "SlidersHorizontal", cn: "调节滑杆",
    why: "「按喜好调节」的通用符号，各类软件里自定义入口的事实标准，认知零成本。",
    pro: "最稳：一眼就懂这里是改设置的地方",
    con: "与「设置」齿轮语义略近（本应用里设置的齿轮就在旁边）" },
  { key: "Blocks", cn: "积木组合",
    why: "把菜单/工具栏当积木拖拽拼搭——与页面里的实际交互（拖入、排序、移除）同构。",
    pro: "最贴交互：拼搭感即工坊本意",
    con: "「块」的隐喻需要一次学习" },
  { key: "LayoutTemplate", cn: "布局模板",
    why: "直指布局编排与预设（出厂/精简/开发者/PDF…），工具属性明确。",
    pro: "点题：这个页面 80% 就是在编排布局",
    con: "覆盖不了未来的非布局定制项" },
  { key: "Component", cn: "组件拼装",
    why: "四个构件自由旋转组合，寓意功能组件化、自由装配；气质偏开发者工具。",
    pro: "独特、辨识度高，不与齿轮/滑杆撞车",
    con: "对普通用户语义偏抽象" },
  { key: "WandSparkles", cn: "魔棒",
    why: "轻巧俏皮的「一键定制」感，视觉上最活泼。",
    pro: "亲和力强、点击欲高",
    con: "魔法隐喻与专业文件管理器气质稍远" },
  { key: "Paintbrush", cn: "个性化毛刷",
    why: "「粉刷」自己的工作台，个性化向。",
    pro: "个性化语义直观",
    con: "偏外观向，与设置-外观页语义有重叠" },
];

const grid = document.getElementById("grid");
const live = document.getElementById("live-btn");
let current = "SlidersHorizontal";

function setIcon(key) {
  current = key;
  live.innerHTML = ICONS[key];
  document.querySelectorAll(".cand").forEach((c) =>
    c.classList.toggle("on", c.dataset.key === key),
  );
}

for (const c of CANDS) {
  const el = document.createElement("div");
  el.className = "cand";
  el.dataset.key = c.key;
  el.innerHTML = `
    <span class="big">${ICONS[c.key]}</span>
    <div>
      <h3>${c.cn}<code>${c.key}</code></h3>
      <p class="why">${c.why}</p>
      <p class="verdict pro">✔ ${c.pro}</p>
      <p class="verdict con">✘ ${c.con}</p>
    </div>`;
  el.addEventListener("click", () => setIcon(c.key));
  grid.appendChild(el);
}
setIcon(current);
</script>
</body>
</html>
