<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>X-Dir Logo 方案 A · 深海曙光</title>
    <style>
      body { font-family: "Segoe UI", "Microsoft YaHei", sans-serif; background: #eef1f6; margin: 0; padding: 32px 40px; color: #1c2430; }
      h1 { font-size: 20px; margin: 0 0 6px; display: flex; align-items: center; gap: 10px; }
      h2 { font-size: 14px; color: #5a6572; margin: 30px 0 12px; font-weight: 600; }
      p.lead { font-size: 13px; color: #5a6572; max-width: 660px; line-height: 1.7; margin: 0; }
      .tag { font-size: 12px; padding: 2px 10px; border-radius: 99px; background: #dce4f0; color: #3574f0; font-weight: 600; }
      .row { display: flex; align-items: flex-end; gap: 24px; flex-wrap: wrap; }
      .cell { display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 11px; color: #5a6572; }
      .titlebar { display: flex; align-items: center; gap: 7px; height: 36px; padding: 0 12px; border-radius: 8px; background: #e9ecf1; border: 1px solid #cfd6e0; }
      .titlebar.dark { background: #202632; border-color: #2c3444; }
      .appname { font-size: 12px; color: #3d4756; margin-left: 2px; font-weight: 600; }
      .titlebar.dark .appname { color: #dfe6f0; }
      .vs { display: flex; gap: 48px; align-items: center; flex-wrap: wrap; }
      .pair { display: flex; align-items: center; gap: 10px; }
      .pair .lbl { font-size: 11px; color: #5a6572; width: 46px; }
      .swatches { display: flex; gap: 14px; margin-top: 10px; }
      .sw { display: flex; align-items: center; gap: 7px; font-size: 12px; color: #3d4756; }
      .sw i { width: 22px; height: 22px; border-radius: 6px; display: inline-block; border: 1px solid rgba(0,0,0,0.12); }
      svg { display: block; }
    </style>
  </head>
  <body>
    <!-- 品牌几何与方案配色（与 tools/gen-logo-icon.mjs 同源：96 视窗 / G=[4,36,68] / CELL=26） -->
    <svg width="0" height="0" style="position:absolute">
      <defs>
        <linearGradient id="cur" gradientUnits="userSpaceOnUse" x1="4" y1="4" x2="94" y2="94">
          <stop offset="0" stop-color="#3574f0" /><stop offset="0.5" stop-color="#5c9dff" /><stop offset="1" stop-color="#bae2fd" />
        </linearGradient>
        <linearGradient id="new" gradientUnits="userSpaceOnUse" x1="4" y1="4" x2="94" y2="94">
          <stop offset="0" stop-color="#2447e8" /><stop offset="0.5" stop-color="#4f8bff" /><stop offset="1" stop-color="#14cfdc" />
        </linearGradient>
      </defs>
    </svg>

    <h1><span class="tag">方案 A</span> 深海曙光</h1>
    <p class="lead">
      保持现方案「单一对角渐变」的克制语言，改动最小：起点由亮蓝加深为靛蓝，末端把近乎白色的冰蓝换成<b>饱和青</b>。
      两端都落在高饱和区间，九宫格从左上到右下的纵深拉满——16px 顶栏尺寸下相邻格子的色差明显可辨。
    </p>

    <h2>尺寸阶梯（16 为顶栏实际尺寸）</h2>
    <div class="row" id="ladder"></div>

    <h2>顶栏场景（浅色 / 深色）</h2>
    <div class="vs">
      <div class="titlebar" id="tb-light"></div>
      <div class="titlebar dark" id="tb-dark"></div>
    </div>

    <h2>与现方案对比（左：现方案 亮蓝→天蓝→冰蓝）</h2>
    <div class="row" id="compare"></div>

    <h2>色标</h2>
    <div class="swatches">
      <span class="sw"><i style="background:#2447e8"></i>靛蓝 #2447E8（0%）</span>
      <span class="sw"><i style="background:#4f8bff"></i>亮蓝 #4F8BFF（50%）</span>
      <span class="sw"><i style="background:#14cfdc"></i>饱和青 #14CFDC（100%）</span>
    </div>

    <script>
      const logo = (size, fill) => {
        const rects = [4, 36, 68]
          .flatMap((y) => [4, 36, 68].map((x) => `<rect x="${x}" y="${y}" width="26" height="26"/>`))
          .join("");
        return `<svg width="${size}" height="${size}" viewBox="0 0 96 96"><g fill="${fill}">${rects}</g></svg>`;
      };
      const cell = (size, fill, label) =>
        `<div class="cell">${logo(size, fill)}<span>${label ?? size + "px"}</span></div>`;
      document.getElementById("ladder").innerHTML =
        [16, 20, 24, 32, 48, 96, 192].map((s) => cell(s, "url(#new)")).join("");
      document.getElementById("tb-light").innerHTML = logo(16, "url(#new)") + '<span class="appname">X-Dir</span>';
      document.getElementById("tb-dark").innerHTML = logo(16, "url(#new)") + '<span class="appname">X-Dir</span>';
      document.getElementById("compare").innerHTML = [192, 48, 32, 16]
        .map((s) => `<div class="pair"><span class="lbl">${s}px</span>${cell(s, "url(#cur)")}${cell(s, "url(#new)")}</div>`)
        .join("");
    </script>
  </body>
</html>
